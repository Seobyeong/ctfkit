[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfkit"
dynamic = ["version"]
description = "드림핵 워게임 학습을 위한 CTF 보조 도구 (CLI + 그래픽 화면)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# forensic lsb (이미지 LSB 추출)에만 필요한 선택 의존성
image = ["pillow"]
# rev disasm (디스어셈블)에만 필요한 선택 의존성
rev = ["capstone"]

[project.scripts]
ctfkit = "ctfkit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ctfkit.__version__" }

[tool.setuptools.packages.find]
include = ["ctfkit*"]

# 영어 n-gram 점수에 쓰는 코퍼스를 패키지에 포함한다
[tool.setuptools.package-data]
"ctfkit.data" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_bench.py 가 저장소 루트의 bench/ 를 import 할 수 있게 한다
pythonpath = ["."]
